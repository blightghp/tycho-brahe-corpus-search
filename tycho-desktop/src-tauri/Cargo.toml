[package]
name = "tycho-desktop"
version = "0.1.0"
description = "Tycho Brahe Search — extensão complementar da Plataforma Tycho Brahe (VERONESI, 2026)"
# Todos os direitos reservados à Plataforma Tycho Brahe © 2026.
# Plataforma criada e desenvolvida principalmente por Luiz Henrique Lima Veronesi (IEL/UNICAMP).
authors = ["Luiz Henrique Lima Veronesi (Plataforma Tycho Brahe, IEL/UNICAMP)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tycho_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.0.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
